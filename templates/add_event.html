{% extends "base.html" %}
{% block title %}Add Event{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="card auth-card wide">
        <h2>Add a New Event</h2>
        <p class="muted">Enter the details of your college event.</p>

        <form method="POST" action="{{ url_for('add_event') }}">
            <label for="name">Event Name</label>
            <input type="text" id="name" name="name" required>

            <div class="two-col">
                <div>
                    <label for="organizer">Club / Committee</label>
                    <input type="text" id="organizer" name="organizer" placeholder="e.g. CSI">
                </div>
                <div>
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="">Select...</option>
                        <option>Sports</option>
                        <option>Tech</option>
                        <option>Workshop</option>
                        <option>Community</option>
                        <option>Cultural</option>
                    </select>
                </div>
            </div>

            <div class="two-col">
                <div>
                    <label for="date">Event Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div>
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" name="venue" required>
                </div>
            </div>

            <div class="two-col">
                <div>
                    <label for="price">Ticket Price (&#8377;)</label>
                    <input type="number" id="price" name="price" min="0" step="0.01" value="0" required>
                </div>
                <div>
                    <label for="capacity">Ticket Capacity</label>
                    <input type="number" id="capacity" name="capacity" min="1" value="100" required>
                </div>
            </div>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>

            <button type="submit" class="btn btn-block">Add Event</button>
        </form>

        <p class="auth-switch"><a href="{{ url_for('admin_dashboard') }}">&larr; Back to Dashboard</a></p>
    </div>
</section>
{% endblock %}
