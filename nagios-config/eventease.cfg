# Nagios Core configuration for EventEase

define command {
    command_name    eventease_check_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p 5000
}

define command {
    command_name    eventease_check_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 5000 -u /health -e 200 -s UP
}

define command {
    command_name    eventease_check_page
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 5000 -u $ARG1$ -e 200
}

define host {
    use                     linux-server
    host_name               eventease-production-host
    alias                   EventEase application host
    address                 host.docker.internal
    check_command           eventease_check_tcp
}

define service {
    use                     generic-service
    host_name               eventease-production-host
    service_description     EventEase Web Portal (Port 5000)
    check_command           eventease_check_page!/
}

define service {
    use                     generic-service
    host_name               eventease-production-host
    service_description     Backend Health and Database (/health)
    check_command           eventease_check_health
}

define service {
    use                     generic-service
    host_name               eventease-production-host
    service_description     Events Page (database read)
    check_command           eventease_check_page!/events
}

define service {
    use                     generic-service
    host_name               eventease-production-host
    service_description     Monitoring Container Disk Space
    check_command           check_local_disk!20%!10%!/
}
