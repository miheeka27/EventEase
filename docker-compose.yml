services:
  eventease:
    build: .
    image: eventease:latest
    container_name: eventease
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /data/database.db
      SECRET_KEY: ${SECRET_KEY:-eventease-dev-key-change-before-deployment}
    volumes:
      - eventease-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - eventease-network

volumes:
  eventease-data:

networks:
  eventease-network:
    driver: bridge
