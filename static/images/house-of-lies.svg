<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="house-of-lies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#1f1235"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="170" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="720" cy="440" r="210" fill="#000000" fill-opacity="0.10"/>
  <circle cx="640" cy="70" r="60" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="400" cy="250" r="230" fill="url(#glow)"/>
  
  <g transform="translate(400 250)"><polygon points="0,-150 -150,-20 150,-20" fill="#f43f5e"/>
<rect x="-115" y="-20" width="230" height="150" rx="10" fill="#fff1f2"/>
<rect x="-30" y="45" width="60" height="85" rx="8" fill="#9f1239"/>
<circle cx="0" cy="-70" r="26" fill="#fff1f2"/>
<text x="0" y="-60" font-family="Georgia, serif" font-size="40" font-weight="700" text-anchor="middle" fill="#9f1239">?</text>
<text x="-72" y="30" font-family="monospace" font-size="38" font-weight="700" text-anchor="middle" fill="#be123c">{ }</text>
<text x="72" y="30" font-family="monospace" font-size="38" font-weight="700" text-anchor="middle" fill="#be123c">&lt;/&gt;</text></g>
</svg>
